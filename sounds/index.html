<meta charset="utf-8">
<title>Gedankenwerk Klänge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control strip, then one band per set with a responsive grid of sound tiles (waveform + level). */
:root{
  --bg:#f3f4f7; --panel:#ffffff; --ink:#15171c; --muted:#5d6472; --line:#dde0e7;
  --accent:#2f56d0; --accent-soft:#e3e9fb; --wave:#9aa3b5; --hot:#c2410c;
  --f-display:"Instrument Sans",system-ui,sans-serif; --f-body:"Instrument Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115; --panel:#181b21; --ink:#e8eaf0; --muted:#98a0b0; --line:#2a2f38;
  --accent:#7d9bff; --accent-soft:#1f2740; --wave:#566073; --hot:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1115; --panel:#181b21; --ink:#e8eaf0; --muted:#98a0b0; --line:#2a2f38;
  --accent:#7d9bff; --accent-soft:#1f2740; --wave:#566073; --hot:#fb923c; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{padding-block:28px 12px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:65ch}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:10px}
.search{flex:1 1 220px;min-width:0}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.search input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);max-width:100%}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.count{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
main{padding-block:8px 48px;display:flex;flex-direction:column;gap:28px}
section h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
section h2 .dir{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 10px 8px;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .12s}
.tile:hover{border-color:var(--accent)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.playing{border-color:var(--accent);background:var(--accent-soft)}
.tile.missing{cursor:default;border-style:dashed;background:transparent;color:var(--muted)}
.tile.missing:hover{border-color:var(--line)}
.tile.missing .ph{height:34px;display:flex;align-items:center;font-size:12px;color:var(--hot)}
code{font-family:var(--f-mono);font-size:.9em}
.name{font-family:var(--f-mono);font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
canvas{width:100%;height:34px;display:block}
.meta{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.meta .lvl.loud,.meta .lvl.quiet{color:var(--hot)}
.legend{font-size:13px;color:var(--muted);margin:10px 0 0;max-width:75ch}
.empty{color:var(--muted);padding:24px 0}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>

<header class="top wrap">

      if (f.missing) { b.className = 'tile missing'; b.disabled = true; b.innerHTML = '<span class="name"></span><span class="ph">fehlt noch</span><span class="meta"><span></span><span></span></span>'; b.querySelector('.name').textContent = f.name; b.title = f.path + ' (fehlt)'; grid.appendChild(b); continue; }
      const off = f.mean - TARGET, cls = off > 6 ? 'loud' : off < -8 ? 'quiet' : '';
      b.innerHTML = '<span class="name"></span><canvas></canvas><span class="meta"><span>' + f.dur.toFixed(2).replace('.',',') + ' s</span><span class="lvl ' + cls + '">' + f.mean.toFixed(1).replace('.',',').replace('-','−') + ' dB</span></span>';
      b.querySelector('.name').textContent = f.name;
      b.title = f.path + (f.desc ? '\n' + f.desc : '');
      b.addEventListener('click', ()=>play(f.path, f, b));
      grid.appendChild(b);
      requestAnimationFrame(()=>draw(b.querySelector('canvas'), f.w));
    }
    list.appendChild(sec);
  }
  document.getElementById('count').textContent = shown + ' angezeigt';
  if (!shown) list.innerHTML = '<p class="empty">Kein Sound passt zur Suche.</p>';
}
async function play(path, f, tile){
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  if (current) { try { current.stop(); } catch(e) {} }
  if (currentTile) currentTile.classList.remove('playing');
  let buf = cache.get(path);
  if (!buf) { const r = await fetch(encodeURI(path)); buf = await ctx.decodeAudioData(await r.arrayBuffer()); cache.set(path, buf); }
  const src = ctx.createBufferSource(); src.buffer = buf;
  const gain = ctx.createGain();
  // Angleichen: auf −20 dB Durchschnitt, aber nie über −1 dB Spitze
  const db = norm.checked ? Math.min(TARGET - f.mean, -1 - f.max) : 0;
  gain.gain.value = Math.pow(10, db/20);
  src.connect(gain).connect(ctx.destination); src.start();
  current = src; currentTile = tile; tile.classList.add('playing');
  src.onended = ()=>{ tile.classList.remove('playing'); if (current === src) { current = null; currentTile = null; } };
}
q.addEventListener('input', render); sel.addEventListener('change', render);
let rt; addEventListener('resize', ()=>{ clearTimeout(rt); rt = setTimeout(render, 150); });
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
render();
</script>
